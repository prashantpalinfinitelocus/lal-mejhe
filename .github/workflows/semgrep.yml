name: Semgrep (PHP and JavaScript SAST)
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "41 3 * * 1"}]
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: {image: semgrep/semgrep}
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/php --config p/javascript --config p/security-audit --config p/owasp-top-ten --metrics=off --sarif --output semgrep.sarif public_html
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: semgrep.sarif, category: semgrep}
